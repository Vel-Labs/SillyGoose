      - "Roadmap step map"
      - "Current verification status"
    constraints:
      - "May edit only this goal's goal.md, state.yaml, and notes unless a separate active Worker permits implementation changes."
      - "Do not leave a completed Worker slice as the final state when roadmap steps remain incomplete."
    expected_output:
      - "Updated task statuses."
      - "New bounded Worker/Judge tasks as needed."
      - "Receipts for blocked work and safe follow-up paths."
    receipt:
      result: done
      summary: "Step 2 is now verified locally and through the configured Supabase adapter. Added the next bounded Worker slice for steps 3, 4, 6, and 5 as a single dogfood growth-loop surface because the features share store/schema/profile UI and must be verified together."
      spawned_tasks:
        - T007

