version: 2
goal:
  slug: complete-roadmap-steps-2-6
  title: Complete Roadmap Steps 2-6
  kind: existing_plan
  status: done
  created_at: "2026-05-18"
  mode: existing_plan
  original_request: "Create a GoalBuddy goal for steps 2-6 of ROADMAP.md and docs/roadmaps/CURRENT_STATE_AND_NEXT.md, validate and complete them end to end, and allow agents to operate Vercel and Supabase as needed."
  interpreted_outcome: "Roadmap steps 2-6 are validated, implemented, verified, and dogfoodable with actionable feedback."
  likely_misfire: "Marking roadmap checkboxes or shipping an isolated slice without proving the end-to-end demo is dogfoodable."
  completion_proof: "Final Judge/PM audit maps steps 2-6 to receipts, local/browser verification, dogfood evidence, and Vercel/Supabase checks when used."
  intake:
    shape: existing_plan
    authority: requested
    proof_type:
      - test
      - demo
      - artifact
      - review
      - metric
    existing_plan_facts:
      - "ROADMAP.md contains the roadmap steps to validate."
      - "docs/roadmaps/CURRENT_STATE_AND_NEXT.md contains the current-state companion plan."
      - "Only steps 2-6 are in this tranche."
      - "The user must be able to dogfood properly and produce actionable feedback."
      - "Vercel and Supabase may be used by agents as needed."
  constraints:
    - "Preserve local-first WebAuthn/Ledger demo behavior unless a validated roadmap slice requires service-backed behavior."
    - "Keep Supabase behind explicit adapter/service boundaries; do not silently replace local demo behavior."
    - "Use Vercel for preview/deployment verification only when needed by a task."
    - "Do not expose secrets or credential values in receipts."
    - "Stop before destructive Supabase operations, production data resets, irreversible Vercel changes, or ambiguous credential handling."
    - "State.yaml remains board truth."
rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
agents:
  scout: installed
  worker: installed
  judge: installed
visual_board:
  selected: unknown
  local:
    status: not_requested
    url: null
    command: "npx goalbuddy board docs/goals/complete-roadmap-steps-2-6"
  github_projects:
    status: not_requested
    url: null
    command: "npx goalbuddy extend github-projects"
    missing: []
active_task: null
external_capabilities:
  vercel:
    allowed: true
    purpose:
      - "Inspect project/deployment state when roadmap verification requires it."
      - "Use preview/deployment evidence for dogfood validation when local evidence is insufficient."
    stop_if:
      - "A task would mutate production routing, domains, env vars, or deployment settings without explicit approval."
      - "A task requires secrets that are not already available through approved local/plugin surfaces."
  supabase:
    allowed: true
    purpose:
      - "Inspect schema/RLS/service state when roadmap steps require persistence verification."
      - "Apply bounded, reviewed schema or adapter changes only from an active Worker task with explicit allowed files and verification."
    stop_if:
      - "A task would drop/reset production data or weaken RLS without explicit approval."
      - "A task would expose service-role credentials or other secret values."
tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    objective: "Map roadmap steps 2-6 from the two roadmap files to current repo state, dogfood-critical workflows, verification commands, and service dependencies."
    inputs:
      - "ROADMAP.md"
      - "docs/roadmaps/CURRENT_STATE_AND_NEXT.md"
      - "Current repo file tree and package scripts"
      - "Existing docs/goals and known demo contracts"
    constraints:
      - "Read-only."
      - "Do not edit roadmap or implementation files."
      - "Preserve step numbers and exact acceptance claims from the source roadmap files."
      - "Identify where Vercel or Supabase is required versus merely optional."
    expected_output:
      - "Step 2-6 map with current status: done | partial | missing | unclear."
      - "Acceptance criteria for each step."
      - "Dogfood workflow list and feedback capture expectations."
      - "Verification command list and browser checks."
      - "Service dependency map for Vercel and Supabase."
      - "Risks, blockers, and candidate Worker slices."
    receipt:
      result: done
      summary: "Mapped roadmap steps 2-6. Step 5 is partial through schema/catalog/Profile groundwork; steps 2-4 and 6 are missing as implemented dogfood workflows. Supabase is required for durable acceptance on steps 2-4 and likely 6; Vercel is optional until production/WebAuthn host verification."
      evidence:
        - "ROADMAP.md: Wallet Proof badge requires Profile link action, signed ownership challenge, linked_wallets persistence, and separate Human Verified/Wallet Proof identity."
        - "ROADMAP.md: Signed rivalry requires off-chain EIP-712 challenge with nonce, challenger, rival, room/game key, expiration, linked wallet, signature, and status in Supabase."
        - "ROADMAP.md: $Bread requires off-chain Supabase balances/history, rewards, GG tips, transfers, and stake lock/release semantics."
        - "ROADMAP.md: Achievement expansion reuses achievements/user_achievements with game/social/bread/web3/streak/seasonal/flockerroom categories and Flockerroom reward/progress fields."
        - "ROADMAP.md: Verified messaging requires lightweight message/ping and server-backed in-app notifications."
        - "app/profile/page.tsx currently renders Human-Verified/Security Key Profile but no Link Wallet, Wallet Proof, expanded achievement registry, or ping surface."
        - "docs/roadmaps/CURRENT_STATE_AND_NEXT.md lists npm run typecheck, npm run build, and npm run validate:contracts as implementation gates."
      spawned_tasks:
        - T002

  - id: T002
    type: judge
    assignee: Judge
    status: done
    objective: "Validate the Scout map and choose the safest execution order for completing steps 2-6 end to end."
    inputs:
      - "T001 receipt or note"
      - "ROADMAP.md"
      - "docs/roadmaps/CURRENT_STATE_AND_NEXT.md"
      - "Current git diff and verification freshness"
    constraints:
      - "Read-only."
      - "Do not accept documentation-only completion unless the roadmap step is explicitly documentation-only."
      - "Prioritize dogfood-blocking behavior and verifiable service boundaries."
    expected_output:
      - "Decision on execution order."
      - "Per-step completion bar."
      - "First Worker objective."
      - "Exact allowed_files for the first Worker."
      - "Verification commands and browser checks for the first Worker."
      - "Stop conditions, including Vercel/Supabase escalation boundaries."
    receipt:
      result: done
      decision: "Approved execution order: Step 2 Wallet Proof, Step 3 signed rivalry, Step 4 $Bread ledger, Step 6 verified messaging, then Step 5 achievement expansion once behavior exists to award."
      summary: "First Worker should complete Step 2 as a vertical local-first wallet-proof slice with real server-side signature verification, Profile UI, store/Supabase adapter persistence, and separate Human Verified vs Wallet Proof states."
      next_allowed_task: T003
      completion_bar:
        step_2_wallet_proof: "25% - schema exists, but challenge/API/Profile/store proof missing."
        step_3_signed_rivalry: "5% - rival groundwork only."
        step_4_bread_ledger: "0% - no balances/history/stake/tip/transfer boundary."
        step_5_achievement_expansion: "35% - schema/catalog/Profile basics only."
        step_6_verified_messaging: "0% - no ping/notification model or UI."
      missing_evidence:
        - "No current post-diff typecheck/build/validate:contracts receipt."
        - "No browser dogfood receipt for /profile wallet proof."
        - "No live Supabase linked_wallets persistence proof."
        - "No Vercel evidence required yet."

  - id: T003
    type: worker
    assignee: Worker
    status: done
    objective: "Complete roadmap Step 2 as a vertical local-first wallet-proof slice with optional Profile wallet linking, signed ownership challenge and verification routes, linked_wallets persistence through the existing store/Supabase adapter boundary, and separate Human Verified and Wallet Proof states."
    allowed_files:
      - "app/profile/page.tsx"
      - "components/wallet-proof-panel.tsx"
      - "app/api/wallet-proof/challenge/route.ts"
      - "app/api/wallet-proof/verify/route.ts"
      - "lib/wallet-proof.ts"
      - "lib/auth/store.ts"
      - "docs/integrations/SUPABASE_SCHEMA.sql"
      - "app/globals.css"
      - "package.json"
      - "package-lock.json"
    verify:
      - "npm run typecheck"
      - "npm run build"
      - "npm run validate:contracts"
    stop_if:
      - "Need files outside allowed_files."
      - "The slice requires destructive Supabase or irreversible Vercel changes."
      - "The roadmap/source-state interpretation is ambiguous."
      - "Verification fails twice for the same unexplained reason."
      - "Secrets or credentials would need to be printed or committed."
      - "Cannot verify signatures server-side and would only store an unchecked address/signature as Wallet Proof."
      - "Wallet proof replaces or weakens the WebAuthn/Security Key Human Verified identity boundary."
      - "Local fallback would be presented as durable Supabase or real wallet proof."
    receipt:
      result: done
      changed_files:
        - "app/profile/page.tsx"
        - "components/wallet-proof-panel.tsx"
        - "app/api/wallet-proof/challenge/route.ts"
        - "app/api/wallet-proof/verify/route.ts"
        - "lib/wallet-proof.ts"
        - "lib/auth/store.ts"
        - "docs/integrations/SUPABASE_SCHEMA.sql"
        - "app/globals.css"
        - "package.json"
        - "package-lock.json"
      commands:
        - cmd: "npm install ethers@^6.15.0"
          status: pass
        - cmd: "npm run typecheck"
          status: pass
        - cmd: "npm run build"
          status: pass
        - cmd: "npm run validate:contracts"
          status: pass
        - cmd: "DEMO_STORE_FILE=/tmp/silly-goose-wallet-proof-test.json npx tsx -e <wallet proof helper smoke>"
          status: pass
      browser_checks:
        - "Chrome local dev server at http://127.0.0.1:3000 reached /profile via existing demo-only fallback."
        - "Observed Security Key Profile and Wallet Optional badges together."
        - "Observed Wallet Proof panel with Base Identity: Human Verified, Wallet Status: Not linked, and Add Wallet Proof button."
      summary: "Step 2 vertical slice added optional Wallet Proof UI, server-side challenge and signature verification routes, linked_wallets persistence through local store and Supabase REST adapter, and schema support for wallet-proof challenges/audits. Security Key Human Verified remains the base identity."
      caveats:
        - "Live Supabase linked_wallets persistence was not exercised because this slice did not mutate remote services or print credentials."
        - "Chrome had wallet extensions installed, so the no-injected-wallet branch was not browser-clicked; the UI still renders optional/not-linked state before wallet interaction."

  - id: T004
    type: judge
    assignee: Judge
    status: done
    objective: "Audit the first implementation slice and decide whether to activate the next Worker slice, use Vercel/Supabase verification, or repair verification gaps."
    inputs:
      - "T003 receipt"
      - "Current diff"
      - "Latest local/browser verification"
      - "Roadmap step map from T001"
    constraints:
      - "Read-only."
      - "A passing code check alone is not enough if the dogfood workflow was affected."
    expected_output:
      - "slice_complete: true | false"
      - "roadmap_steps_advanced"
      - "missing evidence"
      - "next Worker objective, allowed_files, verify, and stop_if when more work remains"
    receipt:
      result: done
      decision: "not_complete"
      slice_complete: false
      full_outcome_complete: false
      summary: "T003 advanced Step 2 from schema-only to local-first UI/API/store implementation, but Step 2 is not accepted complete until browser wallet-free, browser successful-link, and durable persistence evidence are closed."
      roadmap_steps_advanced:
        step_2_wallet_proof: "advanced but not accepted complete"
        step_3_signed_rivalry: "not advanced"
        step_4_bread_ledger: "not advanced"
        step_5_achievement_expansion: "not advanced by this slice"
        step_6_verified_messaging: "not advanced"
      missing_evidence:
        - "No browser-clicked wallet-free flow showing the no-injected-wallet error/copy."
        - "No browser-visible successful Wallet Proof link flow using an injected/mock or real wallet signer."
        - "No live Supabase linked_wallets persistence proof."
        - "No post-current-diff full verification receipt separating T003 files from unrelated dirty changes."
      next_allowed_task: T005

  - id: T005
    type: worker
    assignee: Worker
    status: done
    objective: "Close Step 2 verification gaps without starting Step 3: re-run local gates, browser-click /profile in a wallet-free context, prove successful Profile Wallet Proof linking with deterministic injected/mock or real wallet signing, and exercise linked_wallets persistence against live Supabase only if approved demo credentials are already available and non-production/demo."
    allowed_files:
      - "app/profile/page.tsx"
      - "components/wallet-proof-panel.tsx"
      - "app/api/wallet-proof/challenge/route.ts"
      - "app/api/wallet-proof/verify/route.ts"
      - "lib/wallet-proof.ts"
      - "lib/auth/store.ts"
      - "docs/integrations/SUPABASE_SCHEMA.sql"
      - "app/globals.css"
      - "package.json"
      - "package-lock.json"
    verify:
      - "npm run typecheck"
      - "npm run build"
      - "npm run validate:contracts"
      - "DEMO_STORE_FILE=/tmp/silly-goose-wallet-proof-test.json npx tsx -e <wallet proof challenge/sign/verify temp-store smoke>"
      - "Browser check: /profile shows Human Verified base identity and Wallet Optional before linking."
      - "Browser check: wallet-free context clicking Add Wallet Proof shows no-wallet optional-path error without breaking Security Key status."
      - "Browser check: injected/mock or real wallet signer completes Add Wallet Proof and page shows Wallet Proof linked/address."
      - "Supabase check if approved env is already configured: challenge+verify persists linked_wallets through DEMO_STORE_ADAPTER=supabase without printing secrets."
    stop_if:
      - "Need files outside allowed_files."
      - "Supabase target appears production, unknown, or requires destructive cleanup/reset."
      - "Credentials or secret values would need to be printed or committed."
      - "Browser wallet verification cannot be performed without installing extensions or changing user Chrome state."
      - "Verification fails twice for the same unexplained reason."
      - "Any fix would weaken Security Key Human Verified as the base identity or present local fallback as durable Supabase proof."
    receipt:
      result: done
      changed_files:
        - "docs/integrations/SUPABASE_SCHEMA.sql"
      service_changes:
        - "Applied non-destructive remote Supabase check-constraint updates for wallet-proof challenge purpose and wallet audit type in schema silly_goose_entertainment."
      commands:
        - cmd: "isolated headless Chrome wallet-free /profile check"
          status: pass
        - cmd: "isolated headless Chrome injected-wallet /profile Add Wallet Proof check"
          status: pass
        - cmd: "npx supabase db query --linked <constraint update SQL>"
          status: pass
        - cmd: "DEMO_STORE_ADAPTER=supabase wallet-proof challenge/sign/verify smoke"
          status: pass
        - cmd: "npm run typecheck"
          status: pass
        - cmd: "npm run build"
          status: pass
        - cmd: "npm run validate:contracts"
          status: pass
        - cmd: "DEMO_STORE_FILE=/tmp/silly-goose-wallet-proof-test.json npx tsx -e <wallet proof challenge/sign/verify temp-store smoke>"
          status: pass
      browser_checks:
        - "Wallet-free extension-disabled Chrome: /profile showed Human Verified, Wallet Optional, Wallet Proof, Not linked, and clicking Add Wallet Proof showed the no browser wallet optional-path error."
        - "Injected deterministic wallet Chrome: clicking Add Wallet Proof completed the same server-verified signature route and showed linked wallet proof/address while preserving Security Key Profile."
      summary: "Closed Step 2 verification gaps. Wallet Proof is now dogfoodable locally, validates signatures server-side, persists in local store and configured Supabase adapter, and keeps Security Key Human Verified as base identity."

  - id: T006
    type: pm
    assignee: PM
    status: done
    objective: "Refresh the board after each completed or blocked slice until all roadmap steps 2-6 have a done, blocked, or replaced task path."
    inputs:
